    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let travelData = null;
        let map = null;
        // 目前這個行程的資料夾（例如 'nl_germany'、'kansai'），用來組出
        // attractions.json / hotels.json 等輔助資料的路徑，取代舊版寫死
        // 'data/nl_germany/...' 的做法，讓引擎可以服務任何一個行程資料夾
        let tripFolder = 'nl_germany';

        // 获取URL参数
        function getUrlParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        // 回到頂部按鈕：捲動超過一個視窗高度才顯示
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.addEventListener('scroll', () => {
            const btn = document.getElementById('backToTopBtn');
            if (window.scrollY > window.innerHeight * 0.6) {
                btn.classList.add('visible');
            } else {
                btn.classList.remove('visible');
            }
        });

        // 初始化（DOMContentLoaded 比 load 更早觸發，不必等待地圖庫的圖片/字型資源）
        document.addEventListener('DOMContentLoaded', async () => {
            let id = getUrlParam('id');
            let manifest = null;
            try {
                manifest = await fetch('data/manifest.json').then(r => r.json());
            } catch (e) {
                manifest = null;
            }
            if (!id) {
                if (manifest && manifest.itineraries && manifest.itineraries.length > 0) {
                    id = manifest.itineraries[0].filename.replace('.json', '');
                } else {
                    showError('找不到行程');
                    return;
                }
            }
            if (!id) {
                showError('找不到行程');
                return;
            }

            // 依 id 找出這個行程所在的資料夾、主題與 schema（daycard schema 的行程如
            // kansai 會把 theme/schema 放在 manifest 裡；找不到就照舊預設
            // leather + legacy，行為與舊版一致）
            tripFolder = id.split('/')[0] || 'nl_germany';
            const manifestItem = manifest && manifest.itineraries
                ? manifest.itineraries.find(it => it.filename.replace('.json', '') === id)
                : null;
            const theme = (manifestItem && manifestItem.theme) || 'leather';
            document.documentElement.dataset.theme = theme;
            const tripSchema = (manifestItem && manifestItem.schema) || 'legacy';
            // 雪花裝飾只在 winter-night 主題才有內容；leather 主題保持完全空白，
            // 確保頁面文字內容跟改版前逐字一致（不只是視覺上看不見而已）
            const snowEl = document.getElementById('ticketSnowflakes');
            if (snowEl) snowEl.textContent = theme === 'winter-night' ? '❆ ❅ ❆' : '';

            // legacy schema（例如 nl_germany）才需要景點/博物館卡/飯店/交通/打包清單/
            // 推薦/隨興小筆這一整套輔助資料；daycard schema（例如 kansai）目前沒有
            // 這些資料檔，直接跳過可避免一堆沒意義的 404
            if (tripSchema === 'legacy') {
                // 等所有輔助資料都載入完成後才渲染，避免 recommendationsData 等尚未就緒導致區塊漏顯示
                await Promise.all([
                    loadAttractionsData(),
                    loadMuseumCardData(),
                    loadHotelsData(),
                    loadTransportationData(),
                    loadPackingListData(),
                    loadRecommendationsData(),
                    loadNotesData()
                ]);
            }
            await loadItinerary(id);

            // 支援舊網址轉址帶著要開哪個分頁過來，例如 ?tab=events（見 kansai-events.html）
            const wantedTab = getUrlParam('tab');
            if (wantedTab) {
                const btn = document.querySelector(`.tab-btn[data-tab="${wantedTab}"]`);
                if (btn && !btn.classList.contains('tab-hidden')) {
                    switchTab(wantedTab, btn);
                }
            }
        });

        // 加载行程数据
        async function loadItinerary(id) {
            try {
                let data;

                // 先尝试从 manifest 找文件
                try {
                    const manifestRes = await fetch('data/manifest.json');
                    if (manifestRes.ok) {
                        const manifest = await manifestRes.json();
                        const item = manifest.itineraries.find(it => it.filename.replace('.json', '') === id);

                        if (item) {
                            const response = await fetch(`data/${item.filename}`);
                            if (!response.ok) throw new Error('File not found');
                            data = await response.json();
                        }
                    }
                } catch (error) {
                    console.log('Manifest not found, trying localStorage');
                }

                // 如果从文件加载失败，尝试从 localStorage 加载自定义行程
                if (!data) {
                    const saved = localStorage.getItem('customItineraries');
                    if (!saved) throw new Error('Itinerary not found');

                    const itineraries = JSON.parse(saved);
                    const itinerary = itineraries.find(it => it.id === id);
                    if (!itinerary || !itinerary.data) throw new Error('Itinerary not found');
                    data = itinerary.data;
                }

                travelData = data;
                renderPage();
            } catch (error) {
                console.error('Error loading itinerary:', error);
                showError('載入行程失敗');
            }
        }

        // 显示错误
        function showError(message) {
            document.querySelector('.container').innerHTML = `
                <div class="error">
                    <div class="error-icon">❌</div>
                    <h2>${message}</h2>
                    <p style="margin-top: 10px; color: #666;">
                        <a href="index.html" style="color: #8B6F47;">返回行程列表</a>
                    </p>
                </div>
            `;
        }

        // 计算天数
        function calculateDays() {
            if (!travelData.startDate || !travelData.endDate) return '--';

            const start = new Date(travelData.startDate);
            const end = new Date(travelData.endDate);
            const days = Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1;
            return days;
        }

        // ============================================================
        // 「今天模式」共用的正規化每日資料模型
        // 不管行程是 legacy schema（travelData.itinerary，中文欄位）還是
        // daycard schema（travelData.days），都轉成同一份陣列：
        //   { index, dayNumber, dateISO, dateLabel, title, hotelRaw,
        //     hotelName, hotelCity, items:[{label, html}], flight }
        // 今天模式／導航連結／日期 chip／捲動定位等新功能一律只讀這份資料，
        // 不直接碰 travelData.itinerary / travelData.days，兩種 schema 才能
        // 共用同一套邏輯。
        // ============================================================
        let normalizedDays = [];

        // 取得目前「今天」的日期（YYYY-MM-DD，用本地時區而非 UTC，避免快到
        // 午夜時因時區換算跑到前一天）。支援 ?today=YYYY-MM-DD 覆寫方便測試。
        function getTodayISO() {
            const override = getUrlParam('today');
            if (override && /^\d{4}-\d{2}-\d{2}$/.test(override)) return override;
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        // 兩種 schema 的每日日期字串都只有「月/日」沒有年份（例如「7/30 (四)」
        // 「12/25（五）」），要靠行程本身的 startDate/endDate 推回實際年份。
        // 用行程起訖年份 -1/0/+1 三個候選年份，挑離 startDate~endDate 這個區間
        // 最近的那個，可以正確處理跨年行程（例如12月出發、1月回來）。
        function resolveDayISO(dateLabel, startISO, endISO) {
            if (!dateLabel) return null;
            const m = dateLabel.match(/(\d{1,2})\s*\/\s*(\d{1,2})/);
            if (!m) return null;
            const month = parseInt(m[1], 10);
            const day = parseInt(m[2], 10);
            const pad = n => String(n).padStart(2, '0');
            const baseYear = startISO ? parseInt(startISO.slice(0, 4), 10) : new Date().getFullYear();
            const candidates = [baseYear - 1, baseYear, baseYear + 1].map(y => `${y}-${pad(month)}-${pad(day)}`);
            if (!startISO || !endISO) return candidates[1];
            const startTime = new Date(startISO).getTime();
            const endTime = new Date(endISO).getTime();
            let best = candidates[1];
            let bestDist = Infinity;
            candidates.forEach(c => {
                const t = new Date(c).getTime();
                const dist = Math.min(Math.abs(t - startTime), Math.abs(t - endTime));
                if (dist < bestDist) { bestDist = dist; best = c; }
            });
            return best;
        }

        function buildNormalizedDays() {
            normalizedDays = [];
            const startISO = travelData.startDate;
            const endISO = travelData.endDate;

            if (Array.isArray(travelData.days) && travelData.days.length > 0) {
                // daycard schema（例如 kansai）
                travelData.days.forEach((day, i) => {
                    const blocks = day.blocks || [];
                    const flightBlock = blocks.find(b => b.type === 'flight') || null;
                    const items = blocks.filter(b => b.type === 'slot').map(b => ({ label: b.tag || '', html: b.html || '' }));
                    normalizedDays.push({
                        index: i,
                        dayNumber: i + 1,
                        dateISO: resolveDayISO(day.date, startISO, endISO),
                        dateLabel: day.date || '',
                        title: day.weekday || '',
                        hotelRaw: day.hotel || null,
                        hotelName: day.hotel || null,
                        hotelCity: null,
                        hotelType: null,
                        items,
                        flight: flightBlock
                    });
                });
                return;
            }

            if (Array.isArray(travelData.itinerary)) {
                // legacy schema（例如 nl_germany），沿用 renderCards() 同一套「有日期
                // 或地點才算一天」的過濾規則，確保 index 跟畫面上渲染出來的卡片對得上
                let idx = 0;
                travelData.itinerary.forEach(day => {
                    if (!day || typeof day !== 'object') return;
                    const dateLabel = day['時間'] || '';
                    const location = day['地點 / 移動'] || '';
                    if (!dateLabel && !location) return;

                    const accommodation = day['每日基地 (住宿地區 / 飯店與訂單資訊)'] || '';
                    const highlights = day['精選景點 (含黃金預約時間)'] || '';
                    const hotelMatch = accommodation.match(/【[^】]+】\s*([^（]+)/);
                    const hotelCleanName = hotelMatch ? hotelMatch[1].trim() : null;
                    const hotelInfo = hotelCleanName ? getHotelInfo(hotelCleanName) : null;
                    const items = highlights.split('、').map(s => s.trim()).filter(Boolean).map(s => ({
                        label: '',
                        html: s.replace(/^\d{1,2}:\d{2}\s+/, '').replace(/\s*\([^)]*\)/, '')
                    }));

                    normalizedDays.push({
                        index: idx,
                        dayNumber: idx + 1,
                        dateISO: resolveDayISO(dateLabel, startISO, endISO),
                        dateLabel,
                        title: location,
                        hotelRaw: accommodation || null,
                        // hotelName／hotelCity 只在 hotels.json 有明確比對到時才填，
                        // 之後今天面板只用這兩個欄位組導航連結，不會拿原始文字
                        // （可能是「【機上】華航 CI73」這種不是地點的描述）去查
                        hotelName: hotelInfo ? hotelInfo.name : null,
                        hotelCity: hotelInfo ? hotelInfo.city : null,
                        hotelType: hotelInfo ? hotelInfo.type : null,
                        items,
                        flight: null
                    });
                    idx++;
                });
            }
        }

        // ============================================================
        // 一鍵導航（Google Maps 搜尋連結）
        // 只在「資料裡本來就有明確名稱」的地方加連結（飯店、景點、有結構化
        // venue 欄位的活動、可以從推薦清單開頭明確切出名稱的餐廳/小吃/伴手
        // 禮），不會從自由描述文字裡憑空猜地點。
        // ============================================================
        // 明確排除清單：字面上不是「可搜尋地點」的住宿/行程描述，不管從哪個
        // schema 或哪個欄位進來，一律不加導航連結。目前遇到的情況：
        //   - 朋友家 / 朋友住處：住朋友家，沒有可查詢的正式地址或店名
        //   - 機上：在飛機上過夜，不是實體地點
        // 用「文字包含這些關鍵字」比對，之後遇到類似情況（例如自己家、民宿掛
        // 假名等）直接把關鍵字加進這裡即可，不用改呼叫端的邏輯。
        const NAV_LINK_STOPLIST = ['朋友家', '朋友住處', '機上'];

        function isRealPlaceName(name) {
            const trimmed = (name || '').trim();
            if (trimmed.length < 2) return false; // 太短、看起來不像地點/店名
            return !NAV_LINK_STOPLIST.some(stop => trimmed.includes(stop));
        }

        function mapsLink(name, city) {
            const cleanName = (name || '').trim();
            if (!isRealPlaceName(cleanName)) return null;
            const query = city ? `${cleanName} ${city}` : cleanName;
            return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
        }

        function navLinkHtml(name, city) {
            const url = mapsLink(name, city);
            if (!url) return '';
            return ` <a class="nav-link" href="${url}" target="_blank" rel="noopener">導航</a>`;
        }

        // 從「店名 (地址) - 說明」這種推薦清單固定格式裡，切出店名跟括號內容，
        // 只有括號內容看起來「像真的地址/店家位置」（含門牌號碼之類的數字，
        // 例如「Blauwpoortshaven 7」「Tilsiter Straße 10」）才回傳；括號內容
        // 只是產品/品牌/風格名稱（例如「(Haribo)」「(Kölsch)」
        // 「(Rutte Jenever)」——沒有任何數字）不算地址，回傳 null 不給連結，
        // 因為那是產品不是地點，導航過去沒有意義。回傳的地址優先於城市名，
        // 組出來的查詢字串更精準（例如「Bembel蘋果酒陶壺
        // Bembeltown，Bockenheim區Tilsiter Straße 10」而不是「Bembel蘋果酒陶壺
        // 法蘭克福」這種整座城市等級、查不到特定地點的查詢）。
        function extractRecommendationPlace(text) {
            // 先把「📍順路(...)」這種開頭的徽章標記拿掉（跟 formatRecommendationItem
            // 用同一個 pattern），不然會把「📍順路」本身誤判成店名
            const withoutBadge = (text || '').replace(/^📍順路(\([^)]*\))?\s*/, '');
            const m = withoutBadge.match(/^([^(（]{2,40}?)\s*[\(（]([^)）]*)[\)）]/);
            if (!m) return null;
            const name = m[1].trim();
            const address = m[2].trim();
            // 這份資料的固定格式是「店名 (地址) - 說明」，括號前只會是純店名。
            // 但少數項目沒有明確店家，是像「海灘紀念品小物 - 說明文字（附註）」
            // 這種先講一段描述、後面才出現一個附註用括號的寫法，此時「括號前
            // 的文字」其實包含了「 - 」分隔的說明，不是真正的店名，要排除掉，
            // 不然會把整句描述誤判成可搜尋的地點名稱
            if (/[-－—]/.test(name)) return null;
            if (!/\d/.test(address)) return null; // 括號內沒有門牌號碼等數字，當作不是明確地址（是產品/品牌名）
            return { name, address };
        }

        // ============================================================
        // 今天模式：出發前顯示倒數，行程期間顯示「今天」面板並標記當天卡片，
        // 結束後兩者都不顯示（"nothing intrusive"）
        // ============================================================
        let currentTripStatus = 'unknown'; // 'before' | 'during' | 'after' | 'unknown'
        let currentTodayDay = null;

        function getTripStatus(todayISO) {
            if (!travelData.startDate || !travelData.endDate) return 'unknown';
            if (todayISO < travelData.startDate) return 'before';
            if (todayISO > travelData.endDate) return 'after';
            return 'during';
        }

        function renderTodayMode() {
            const todayISO = getTodayISO();
            currentTripStatus = getTripStatus(todayISO);
            currentTodayDay = normalizedDays.find(d => d.dateISO === todayISO) || null;

            const countdownEl = document.getElementById('tripCountdown');
            const compactLineEl = document.getElementById('ticketCompactLine');
            const panelEl = document.getElementById('todayPanel');

            const totalDays = calculateDays();
            const dateRange = travelData.startDate && travelData.endDate
                ? `${travelData.startDate} ~ ${travelData.endDate}`
                : '';
            let compactSuffix = '';

            if (currentTripStatus === 'before') {
                const diffDays = Math.ceil((new Date(travelData.startDate) - new Date(todayISO)) / (1000 * 60 * 60 * 24));
                const text = `距離出發還有 ${diffDays} 天`;
                if (countdownEl) countdownEl.textContent = text;
                compactSuffix = ` · ${text}`;
            } else if (countdownEl) {
                countdownEl.textContent = '';
            }

            if (compactLineEl) {
                compactLineEl.textContent = dateRange ? `${dateRange} · 共${totalDays}天${compactSuffix}` : '';
            }

            // 清掉先前可能標記過的「今天」卡片徽章（例如切換 ?today= 測試時）
            document.querySelectorAll('.today-card').forEach(el => {
                el.classList.remove('today-card');
                el.querySelector('.today-card-badge')?.remove();
            });

            if (currentTripStatus !== 'during' || !currentTodayDay) {
                panelEl.classList.remove('visible');
                panelEl.innerHTML = '';
                return;
            }

            const d = currentTodayDay;
            compactSuffix = ` · 今天是第 ${d.dayNumber} 天`;
            if (compactLineEl && dateRange) {
                compactLineEl.textContent = `${dateRange} · 共${totalDays}天${compactSuffix}`;
            }

            const flightHtml = d.flight ? `
                <div class="today-panel-flight">${renderDayFlightBlock(d.flight)}</div>
            ` : '';

            const itemsHtml = d.items.length ? `
                <ul class="today-panel-items">
                    ${d.items.map(item => `<li>${item.label ? `<span class="dc-tag">${item.label}</span> ` : ''}${item.html}</li>`).join('')}
                </ul>
            ` : '';

            // 顯示文字可以用原始描述（例如「【機上】華航 CI73」比純 null 有意義）；
            // 但導航連結只用 hotelName——那是 hotels.json 明確比對到的正式名稱，
            // 不會拿原始描述文字去產生查不到東西的連結。hotelType === 'private'
            // （借宿朋友家）也不給連結，isRealPlaceName() 的關鍵字比對是第二層備援
            const hotelDisplay = d.hotelRaw || d.hotelName;
            const hotelNavLink = d.hotelType === 'private' ? '' : navLinkHtml(d.hotelName, d.hotelCity);
            const hotelHtml = hotelDisplay ? `
                <div class="today-panel-hotel">今晚住宿：${hotelDisplay}${hotelNavLink}</div>
            ` : '';

            panelEl.innerHTML = `
                <div class="today-panel-badge">今天 · 第${d.dayNumber}天</div>
                <div class="today-panel-date">${d.dateLabel}</div>
                <div class="today-panel-title">${d.title}</div>
                ${flightHtml}
                ${itemsHtml}
                ${hotelHtml}
            `;
            panelEl.classList.add('visible');

            // 在「簡要概覽」對應的那張日卡加上「今天」徽章，並在首次載入時捲過去
            const dayEl = document.querySelector(`#cardsContainer [data-day-index="${d.index}"]`);
            if (dayEl) {
                dayEl.classList.add('today-card');
                const badge = document.createElement('span');
                badge.className = 'today-card-badge';
                badge.textContent = '今天';
                dayEl.appendChild(badge);
                setTimeout(() => {
                    if (document.querySelector('.tab-btn[data-tab="cards"]')?.classList.contains('active')) {
                        // 手動算捲動位置（不是用 scrollIntoView）：要讓今天這張卡片捲到
                        // 「緊貼 sticky 日期 chip 列下緣」——這跟 scroll-spy 判斷「目前
                        // 在看哪天」的參考線是同一條線，捲動完成後 chip 高亮才會穩定跟
                        // 「今天」徽章對上同一天，不會因為對齊點沒完全對齊參考線而在
                        // scroll 事件觸發重算時跳回前一天。
                        const nav = document.getElementById('dayJumpNav');
                        const stickyTop = nav ? (parseFloat(nav.style.top) || 0) : 0;
                        const navBottom = nav ? stickyTop + nav.getBoundingClientRect().height : 0;
                        const targetY = dayEl.getBoundingClientRect().top + window.scrollY - navBottom - 1;
                        window.scrollTo({ top: Math.max(targetY, 0), behavior: 'smooth' });

                        // 先直接指定 active chip（不用等捲動動畫跑完/scroll 事件觸發），
                        // 捲動完成後 scroll-spy 的參考線計算此時也會落在同一張卡片上，
                        // 兩者是一致的，不會互相打架
                        document.querySelectorAll('.day-jump-chip').forEach(chip => {
                            chip.classList.toggle('active', chip.getAttribute('data-day-index') === String(d.index));
                        });
                        // 行程天數多的時候（例如 NL 17 天）日期 chip 列會橫向捲動、
                        // 今天那個 chip 不一定落在一開始看到的範圍內，這裡也讓 chip
                        // 列橫向捲到「今天」那個 chip，只捲橫向、不影響垂直捲動位置
                        document.querySelector('.day-jump-chip.active')
                            ?.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                    }
                }, 700);
            }
        }

        // ============================================================
        // 日期 chip 的 sticky 偏移量：桌面版貼在 .tabs 下方；手機版 .tabs
        // 被底部導覽列取代、畫面上沒有東西擋在上面，所以貼齊最上面即可
        // ============================================================
        function updateDayJumpNavOffset() {
            const nav = document.getElementById('dayJumpNav');
            if (!nav) return;
            const isMobile = window.innerWidth <= 768;
            if (isMobile) {
                nav.style.top = '0px';
                return;
            }
            const tabsEl = document.querySelector('.tabs');
            nav.style.top = (tabsEl ? Math.ceil(tabsEl.getBoundingClientRect().height) : 0) + 'px';
        }
        window.addEventListener('resize', () => {
            updateDayJumpNavOffset();
            updateScrollSpyActive();
        });

        // ============================================================
        // Scroll-spy：捲動時高亮目前畫面中的那一天對應的 chip。
        // 用「哪張日卡的頂端離參考線（貼齊 sticky chip 列下方）最近」來判斷，
        // 而不是用 IntersectionObserver 的 isIntersecting——legacy schema
        // 的卡片是三欄網格，同一列的卡片會同時觸發 intersecting，用
        // IntersectionObserver 只看「有沒有進入」會在同一列裡挑到不一定是
        // 使用者觀感上「現在看到的那天」的卡片；改成量測實際位置後，同一列
        // 裡固定挑最左邊（DOM 順序最前面）的那張，結果穩定不會亂跳。
        // ============================================================
        let scrollSpyBound = false;
        let scrollSpyTicking = false;

        function updateScrollSpyActive() {
            const nav = document.getElementById('dayJumpNav');
            const dayEls = document.querySelectorAll('#cardsContainer [data-day-index]');
            if (!dayEls.length || !nav || nav.style.display === 'none') return;

            const refLine = nav.getBoundingClientRect().bottom + 4;
            let bestEl = null;
            let bestDist = Infinity;
            dayEls.forEach(el => {
                const top = el.getBoundingClientRect().top;
                if (top <= refLine) {
                    const dist = refLine - top;
                    if (dist < bestDist) { bestDist = dist; bestEl = el; }
                }
            });
            if (!bestEl) bestEl = dayEls[0];

            const idx = bestEl.getAttribute('data-day-index');
            document.querySelectorAll('.day-jump-chip').forEach(chip => {
                chip.classList.toggle('active', chip.getAttribute('data-day-index') === idx);
            });
        }

        function setupScrollSpy() {
            updateScrollSpyActive();
            if (scrollSpyBound) return;
            scrollSpyBound = true;
            window.addEventListener('scroll', () => {
                if (scrollSpyTicking) return;
                scrollSpyTicking = true;
                requestAnimationFrame(() => {
                    updateScrollSpyActive();
                    scrollSpyTicking = false;
                });
            }, { passive: true });
        }

        // ============================================================
        // 手機版底部導覽列：「今天」＋看得到的分頁（超過 5 個項目時把多出來
        // 的收進「更多」的下拉選單），依 applyTabVisibility() 算出來的
        // visibility 決定要放哪些分頁
        // ============================================================
        const TAB_LABELS = {
            cards: { icon: '🎴', label: '概覽' },
            overview: { icon: '📅', label: '每日' },
            schedule: { icon: '⏰', label: '時間表' },
            map: { icon: '📍', label: '軌跡' },
            flexible: { icon: '🍽️', label: '手冊' },
            transport: { icon: '🚌', label: '交通' },
            packing: { icon: '🎒', label: '打包' },
            notes: { icon: '📝', label: '小筆' },
            events: { icon: '🎄', label: '活動' }
        };
        const TAB_ORDER = ['cards', 'overview', 'schedule', 'map', 'flexible', 'transport', 'packing', 'notes', 'events'];
        let mobileNavOverflowTabs = [];

        function renderMobileNav(visibility) {
            const nav = document.getElementById('mobileNav');
            if (!nav) return;

            const visibleTabs = TAB_ORDER.filter(t => visibility[t]);
            const maxSlots = 5;
            const remaining = maxSlots - 1; // 扣掉固定佔一格的「今天」

            let shown = visibleTabs;
            let overflow = [];
            if (visibleTabs.length > remaining) {
                shown = visibleTabs.slice(0, remaining - 1);
                overflow = visibleTabs.slice(remaining - 1);
            }
            mobileNavOverflowTabs = overflow;

            const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab;

            let html = `
                <button type="button" class="mobile-nav-btn" onclick="scrollToToday()">
                    <span class="mobile-nav-icon">◆</span>今天
                </button>
            `;
            shown.forEach(tab => {
                const meta = TAB_LABELS[tab];
                html += `
                    <button type="button" class="mobile-nav-btn${activeTab === tab ? ' active' : ''}" data-tab="${tab}" onclick="switchTab('${tab}', this)">
                        <span class="mobile-nav-icon">${meta.icon}</span>${meta.label}
                    </button>
                `;
            });
            if (overflow.length) {
                const overflowActive = overflow.includes(activeTab) ? ' active' : '';
                html += `
                    <button type="button" class="mobile-nav-btn${overflowActive}" id="mobileNavMoreBtn" onclick="openMoreSheet()">
                        <span class="mobile-nav-icon">☰</span>更多
                    </button>
                `;
            }

            nav.innerHTML = html;
        }

        function updateMobileNavActive(tabName) {
            document.querySelectorAll('.mobile-nav-btn[data-tab]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tabName);
            });
            const moreBtn = document.getElementById('mobileNavMoreBtn');
            if (moreBtn) moreBtn.classList.toggle('active', mobileNavOverflowTabs.includes(tabName));
        }

        function openMoreSheet() {
            const content = document.getElementById('moreSheetContent');
            const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab;
            content.innerHTML = mobileNavOverflowTabs.map(tab => {
                const meta = TAB_LABELS[tab];
                // 分頁按鈕（.tab-btn）的文字本身就已經含圖示（例如「📍 行程軌跡」），
                // 不要再疊加 meta.icon，否則圖示會重複兩次；找不到對應按鈕時才用
                // TAB_LABELS 的圖示＋短標籤當備援
                const fullLabel = document.querySelector(`.tab-btn[data-tab="${tab}"]`)?.textContent.trim();
                const label = fullLabel || `${meta.icon} ${meta.label}`;
                return `<button type="button" class="more-sheet-btn${activeTab === tab ? ' active' : ''}" onclick="switchTab('${tab}', document.querySelector('.tab-btn[data-tab=&quot;${tab}&quot;]'))">${label}</button>`;
            }).join('');
            document.getElementById('moreSheetBackdrop').classList.add('open');
        }

        function closeMoreSheet(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('moreSheetBackdrop')?.classList.remove('open');
        }

        function scrollToToday() {
            if (currentTripStatus === 'during') {
                const panel = document.getElementById('todayPanel');
                if (panel && panel.classList.contains('visible')) {
                    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    return;
                }
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 渲染页面
        function renderPage() {
            const days = calculateDays();

            document.getElementById('pageTitle').textContent = travelData.title || '行程詳情';
            document.getElementById('departureDateDisplay').textContent = travelData.startDate || '--';
            document.getElementById('returnDateDisplay').textContent = travelData.endDate || '--';
            document.getElementById('totalDaysDisplay').textContent = days + '天';
            document.getElementById('pageSubtitle').textContent =
                `${travelData.startDate} ✈ ${travelData.endDate}`;

            buildNormalizedDays();

            renderDayOverview();
            // renderTimeline(); // 已用地圖替代
            renderCards();
            renderSchedule();
            renderFlexible();
            renderTransport();
            renderWeatherOutlook();
            renderLaundryCookingNotes();
            renderPackingList();
            renderNotes();
            renderEvents();
            const hasLegacyItinerary = Array.isArray(travelData.itinerary) && travelData.itinerary.length > 0;
            if (hasLegacyItinerary) {
                setTimeout(renderMap, 300);
            }
            applyTabVisibility();
            renderTodayMode();
            updateDayJumpNavOffset();
            setupScrollSpy();
        }

        // 依實際載入到的資料決定哪些分頁要顯示：沒有資料的分頁直接隱藏分頁按鈕，
        // 而不是顯示一個空白畫面（例如 kansai 目前沒有打包清單/交通/彈性行程資料）
        function applyTabVisibility() {
            const hasLegacyItinerary = Array.isArray(travelData.itinerary) && travelData.itinerary.length > 0;
            const hasDayCards = Array.isArray(travelData.days) && travelData.days.length > 0;
            const flexibleHasContent = document.getElementById('flexibleContainer') &&
                document.getElementById('flexibleContainer').querySelector('.flexible-location-group') !== null;

            const visibility = {
                cards: hasLegacyItinerary || hasDayCards,
                overview: hasLegacyItinerary,
                schedule: hasLegacyItinerary,
                map: hasLegacyItinerary,
                flexible: hasLegacyItinerary && flexibleHasContent,
                transport: !!(transportationData && transportationData.transport_segments && transportationData.transport_segments.length),
                packing: !!(packingListData && packingListData.packing_categories && packingListData.packing_categories.length),
                notes: !!(notesData && notesData.sections && notesData.sections.length),
                events: !!(travelData.events && travelData.events.items && travelData.events.items.length)
            };

            let activeTabHidden = false;
            Object.entries(visibility).forEach(([tab, visible]) => {
                const btn = document.querySelector(`.tab-btn[data-tab="${tab}"]`);
                if (!btn) return;
                btn.classList.toggle('tab-hidden', !visible);
                if (!visible && btn.classList.contains('active')) activeTabHidden = true;
            });

            if (activeTabHidden) {
                const fallbackTab = visibility.cards ? 'cards' : Object.keys(visibility).find(t => visibility[t]);
                if (fallbackTab) {
                    switchTab(fallbackTab, document.querySelector(`.tab-btn[data-tab="${fallbackTab}"]`));
                }
            }

            renderMobileNav(visibility);
        }

        // 切换标签
        function switchTab(tabName, btnEl) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            document.getElementById(tabName).classList.add('active');
            // btnEl 是呼叫端傳進來的按鈕（onclick="switchTab('x', this)"）；
            // 沒傳的情況（例如程式化切換分頁）就用 data-tab 找回對應按鈕
            const activeBtn = btnEl || document.querySelector(`.tab-btn[data-tab="${tabName}"]`);
            if (activeBtn) activeBtn.classList.add('active');
            updateMobileNavActive(tabName);
            closeMoreSheet();

            // 切換分頁時捲回頁面頂部，避免停留在舊分頁的捲動位置看新分頁內容
            // 注意：.tabs 是 sticky 元素，scrollIntoView 會誤判「已經可見」而不捲動，故直接用 window.scrollTo
            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (tabName === 'map') {
                setTimeout(() => {
                    map.invalidateSize();
                    // 重新調整地圖範圍以適應新的容器尺寸
                    const itinerary = travelData.itinerary || [];
                    const allCityCoordinates = {
                        '台北': [25.0330, 121.5654],
                        '阿姆斯特丹': [52.3676, 4.9041],
                        '鹿特丹': [51.9225, 4.4792],
                        '萊頓': [52.1601, 4.4941],
                        '海牙': [52.0705, 4.2566],
                        '羊角村': [52.7153, 5.8697],
                        '烏特勒支': [52.0907, 5.1214],
                        '梵谷森林': [52.0500, 5.7667],
                        '科隆': [50.9365, 6.9589],
                        '法蘭克福': [50.1109, 8.6821],
                        '海德堡': [49.4134, 8.7100]
                    };

                    const visitedCoords = [];
                    itinerary.forEach(day => {
                        if (!day || typeof day !== 'object') return;
                        const location = day['地點 / 移動'] || '';
                        if (!location) return;

                        // 只加入location中實際出現的城市
                        for (const [cityName, coords] of Object.entries(allCityCoordinates)) {
                            if (location.includes(cityName) && !visitedCoords.some(c =>
                                c[0] === coords[0] && c[1] === coords[1]
                            )) {
                                visitedCoords.push(coords);
                            }
                        }
                    });

                    if (visitedCoords.length > 0) {
                        const bounds = L.latLngBounds(visitedCoords);
                        map.fitBounds(bounds, { padding: [120, 120], maxZoom: 5 });
                    }
                }, 150);
            }
        }

        // 渲染时间线
        function renderTimeline() {
            const container = document.getElementById('timelineContainer');
            const itinerary = travelData.itinerary || [];

            let html = '';
            itinerary.forEach((day, index) => {
                if (!day || typeof day !== 'object') return;

                const date = day['時間'] || '';
                const location = day['地點 / 移動'] || '';
                const highlights = day['精選景點 (含黃金預約時間)'] || '';

                // 只顯示有日期或地點的行程
                if (!date && !location) return;

                html += `
                    <div class="timeline-item">
                        <div class="timeline-dot"></div>
                        <div class="timeline-content">
                            <div class="timeline-date">${date || '待定'}</div>
                            <div style="font-size: 1.1em; font-weight: 600; margin-bottom: 10px;">${location || '行程'}</div>
                            <p style="font-size: 0.9em; color: #666;">${highlights}</p>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html || '<p style="color: white; text-align: center;">無行程數據</p>';
        }

        // 渲染卡片
        function renderCards() {
            // daycard schema（travelData.days，例如 kansai）用完全不同的卡片版型
            // （航班卡／時段條目／飯店框／預訂提醒），走專屬的渲染函式；
            // legacy schema（travelData.itinerary，例如 nl_germany）維持原本邏輯不變
            if (Array.isArray(travelData.days) && travelData.days.length > 0) {
                renderDayCards();
                return;
            }

            const container = document.getElementById('cardsContainer');
            const navContainer = document.getElementById('dayJumpNav');
            const itinerary = travelData.itinerary || [];

            let html = '';
            let navHtml = '';
            let dayIndex = 0;
            itinerary.forEach((day, index) => {
                if (!day || typeof day !== 'object') return;

                const date = day['時間'] || '';
                const location = day['地點 / 移動'] || '';

                // 只顯示有日期或地點的行程
                if (!date && !location) return;

                const thisDayIndex = dayIndex++;
                const accommodation = day['每日基地 (住宿地區 / 飯店與訂單資訊)'] || '';
                const highlights = day['精選景點 (含黃金預約時間)'] || '';
                const tips = day['備註 / 在地指南'] || '';

                navHtml += `<div class="day-jump-chip" data-jump-date="${date}" data-day-index="${thisDayIndex}">${date}</div>`;

                html += `
                    <div class="card" data-card-date="${date}" data-day-index="${thisDayIndex}" style="cursor: pointer;">
                        <div class="card-date" style="font-size: 0.9em; color: #8B6F47; font-weight: 700; margin-bottom: 8px;">${date}</div>
                        <div class="card-location">${location || '行程'}</div>

                        ${accommodation ? `
                            <div class="card-section">
                                <span class="card-label">🏨 住宿</span>
                                ${accommodation}
                            </div>
                        ` : ''}

                        ${highlights ? `
                            <div class="card-section">
                                <span class="card-label">⭐ 景點</span>
                                ${highlights}
                            </div>
                        ` : ''}

                        ${tips ? `
                            <div class="card-section">
                                <span class="card-label">💡 提示</span>
                                ${tips}
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            container.innerHTML = html || '<p style="color: white; text-align: center;">無行程數據</p>';
            if (navContainer) {
                navContainer.style.display = '';
                navContainer.innerHTML = navHtml;
            }

            // 添加卡片點擊導航
            document.querySelectorAll('.card[data-card-date]').forEach(card => {
                card.addEventListener('click', function() {
                    const date = this.getAttribute('data-card-date');
                    switchTab('overview');
                    setTimeout(() => {
                        const target = document.querySelector(`.day-section[data-date="${date}"]`);
                        if (target) {
                            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }
                    }, 100);
                });
            });

            wireDayJumpChips();
        }

        // 頂部快速跳轉列：點 chip 直接捲到對應那張日卡（停留在同一個分頁，
        // 不切換分頁）。legacy／daycard schema 都靠 data-day-index 對應，
        // 讓兩種 schema 共用同一套邏輯（也是 scroll-spy 用的同一個屬性）
        function wireDayJumpChips() {
            document.querySelectorAll('.day-jump-chip[data-day-index]').forEach(chip => {
                chip.addEventListener('click', function(event) {
                    event.stopPropagation();
                    const idx = this.getAttribute('data-day-index');
                    const target = document.querySelector(`#cardsContainer [data-day-index="${idx}"]`);
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                });
            });
        }

        // 渲染 daycard schema 的每日卡片（航班卡／時段條目／飯店框），
        // 以及行程最後的「預訂與準備提醒」清單（travelData.reminders）。
        // 見 data/SCHEMA_EXTENSIONS.md 說明每個欄位的用途。
        function renderDayFlightBlock(flight) {
            const dirIcon = flight.direction === 'return' ? '🛬' : '🛫';
            return `
                <div class="dc-flight-card">
                    <span class="dc-plane-icon">${dirIcon}</span>
                    <div class="dc-flight-top">
                        <span class="dc-airline">${flight.airline || ''}</span>
                        <span class="dc-flight-no">${flight.flightNo || ''}</span>
                    </div>
                    <div class="dc-route-row">
                        <div class="dc-airport">
                            <div class="dc-code">${flight.from?.code || ''}</div>
                            <div class="dc-time">${flight.from?.time || ''}</div>
                            <div class="dc-name">${flight.from?.name || ''}</div>
                        </div>
                        <div class="dc-arrow">✈</div>
                        <div class="dc-airport">
                            <div class="dc-code">${flight.to?.code || ''}</div>
                            <div class="dc-time">${flight.to?.time || ''}</div>
                            <div class="dc-name">${flight.to?.name || ''}</div>
                        </div>
                    </div>
                    ${flight.note ? `<div class="dc-flight-note">${flight.note}</div>` : ''}
                </div>
            `;
        }

        function renderDayCards() {
            const container = document.getElementById('cardsContainer');
            const navContainer = document.getElementById('dayJumpNav');

            const days = travelData.days || [];

            if (navContainer) {
                navContainer.style.display = days.length ? '' : 'none';
                navContainer.innerHTML = days.map((day, i) =>
                    `<div class="day-jump-chip" data-day-index="${i}">${day.day || day.date || (i + 1)}</div>`
                ).join('');
            }

            let html = days.map((day, i) => {
                const blocksHtml = (day.blocks || []).map(block => {
                    if (block.type === 'flight') return renderDayFlightBlock(block);
                    if (block.type === 'slot') {
                        return `
                            <div class="dc-slot">
                                <span class="dc-tag">${block.tag || ''}</span>
                                <span class="dc-text">${block.html || ''}</span>
                            </div>
                        `;
                    }
                    return '';
                }).join('');

                return `
                    <div class="dc-day-card" data-day-index="${i}">
                        <span class="dc-day-badge">${day.day || ''}</span>
                        <div class="dc-day-meta">
                            <span class="dc-date">${day.date || ''}</span>
                            <span class="dc-weekday">${day.weekday || ''}</span>
                        </div>
                        ${blocksHtml}
                        ${day.hotel ? `<div class="dc-hotel-box">🏨 <span>${day.hotel}</span>${navLinkHtml(day.hotel)}</div>` : ''}
                    </div>
                `;
            }).join('');

            if (travelData.reminders && travelData.reminders.items && travelData.reminders.items.length) {
                const r = travelData.reminders;
                html += `
                    <div class="dc-reminders">
                        <h2>${r.title || '預訂與準備提醒'}</h2>
                        <ul>
                            ${r.items.map(item => `<li><span class="dc-box"></span><span>${item}</span></li>`).join('')}
                        </ul>
                        ${r.footnote ? `<div class="dc-footnote">${r.footnote}</div>` : ''}
                    </div>
                `;
            }

            if (travelData.footerNote) {
                html += `<div class="dc-footer-note">${travelData.footerNote}</div>`;
            }

            container.innerHTML = html || '<p style="color: white; text-align: center;">無行程數據</p>';
            wireDayJumpChips();
        }

        // 渲染「確定活動」分頁（travelData.events）：警告卡（若有）+ 活動卡列表。
        // 目前只有 kansai 有這份資料；沒有 events 資料的行程分頁按鈕會被
        // applyTabVisibility() 隱藏，不會顯示空白分頁。
        function renderEvents() {
            const container = document.getElementById('eventsContainer');
            if (!container) return;

            const events = travelData.events;
            if (!events || !events.items || !events.items.length) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            if (events.subtitle) {
                html += `<p style="text-align:center; color: var(--text-secondary); margin-bottom: 20px;">${events.subtitle}</p>`;
            }

            if (events.warning) {
                html += `
                    <div class="dc-warning-card">
                        <div class="dc-warning-title">${events.warning.title || ''}</div>
                        <div class="dc-warning-body">${events.warning.html || ''}</div>
                    </div>
                `;
            }

            html += events.items.map(item => {
                const statusClass = item.status === 'confirmed' ? 'confirmed' : 'check';
                const rowsHtml = (item.rows || []).map(row => `
                    <div class="dc-row">${row.label ? `<span class="dc-label">${row.label}</span>` : ''}${row.html || ''}</div>
                `).join('');
                return `
                    <div class="dc-event-card">
                        <span class="dc-day-badge">${item.day || ''}</span>
                        <div class="dc-event-title">${item.title || ''}${item.venue ? navLinkHtml(item.venue) : ''}</div>
                        <span class="dc-event-status ${statusClass}">${item.statusLabel || ''}</span>
                        <div class="dc-event-body">${rowsHtml}</div>
                        ${item.source ? `<div class="dc-event-source">來源：<a href="${item.source.url}" target="_blank" rel="noopener">${item.source.label}</a>${item.source.note || ''}</div>` : ''}
                    </div>
                `;
            }).join('');

            if (events.footnote) {
                html += `<div class="dc-footer-note">${events.footnote}</div>`;
            }

            container.innerHTML = html;
        }

        // 渲染地图 - 顯示行程軌跡
        function renderMap() {
            const mapContainer = document.getElementById('mapContainer');
            if (!mapContainer) return;

            // 清理舊地圖
            if (map) {
                map.remove();
                map = null;
            }

            mapContainer.innerHTML = '<div id="mapElement"></div>';

            // 完整城市座標庫 - 只保留實際地點
            const allCityCoordinates = {
                '台北': [25.0330, 121.5654],
                '阿姆斯特丹': [52.3676, 4.9041],
                '鹿特丹': [51.9225, 4.4792],
                '萊頓': [52.1601, 4.4941],
                '海牙': [52.0705, 4.2566],
                '羊角村': [52.7153, 5.8697],
                '烏特勒支': [52.0907, 5.1214],
                '梵谷森林': [52.0500, 5.7667],
                '科隆': [50.9365, 6.9589],
                '法蘭克福': [50.1109, 8.6821],
                '海德堡': [49.4134, 8.7100]
            };

            try {
                map = L.map('mapElement').setView([51.5, 5], 5);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap'
                }).addTo(map);
            } catch (error) {
                console.error('地圖初始化錯誤:', error);
                return;
            }

            const itinerary = travelData.itinerary || [];
            const visitedCities = [];
            const routePoints = [];
            let dayCount = 0;

            // 提取行程軌跡 - 只使用JSON中實際出現的城市
            itinerary.forEach((day, index) => {
                if (!day || typeof day !== 'object') return;

                const date = day['時間'] || '';
                const location = day['地點 / 移動'] || '';
                if (!date || !location) return;

                dayCount++;

                // 解析位置（從地點字段中提取實際城市名）
                // 只在座標庫中存在的城市才會被顯示
                const cityMatches = [];
                for (const [cityName, coords] of Object.entries(allCityCoordinates)) {
                    if (location.includes(cityName)) {
                        cityMatches.push({ name: cityName, coords: coords });
                    }
                }

                cityMatches.forEach(city => {
                    routePoints.push(city.coords);

                    // 避免重複添加同一城市
                    if (!visitedCities.find(v => v.name === city.name)) {
                        visitedCities.push({
                            name: city.name,
                            coords: city.coords,
                            day: dayCount,
                            date: date
                        });
                    }
                });
            });

            // 繪製軌跡線
            if (routePoints.length > 1) {
                L.polyline(routePoints, {
                    color: '#d4a574',
                    weight: 3,
                    opacity: 0.6,
                    dashArray: '5, 5'
                }).addTo(map);
            }

            // 添加城市標記
            const cityLabels = [];
            visitedCities.forEach((city, idx) => {
                const isFirstCity = idx === 0;
                const isLastCity = idx === visitedCities.length - 1;

                L.circleMarker(city.coords, {
                    radius: isFirstCity || isLastCity ? 12 : 8,
                    fillColor: isFirstCity ? '#51cf66' : (isLastCity ? '#ff6b6b' : '#d4a574'),
                    color: 'white',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.8
                }).bindPopup(`
                    <strong>${city.name}</strong><br>
                    Day ${city.day}<br>
                    ${city.date}
                `).addTo(map);

                // 添加日期標籤
                L.marker(city.coords, {
                    icon: L.divIcon({
                        className: 'day-label',
                        html: `<div style="background:#d4a574;color:white;padding:4px 8px;border-radius:50%;font-weight:bold;font-size:12px;">${city.day}</div>`,
                        iconSize: [30, 30]
                    })
                }).addTo(map);

                // 添加城市名標籤 (縮放時顯示)
                const cityNameMarker = L.marker(city.coords, {
                    icon: L.divIcon({
                        className: 'city-name-label',
                        html: `<div style="background:rgba(212,165,116,0.9);color:white;padding:4px 8px;border-radius:4px;font-weight:bold;font-size:11px;white-space:nowrap;margin-top:25px;">${city.name}</div>`,
                        iconSize: [80, 40],
                        iconAnchor: [40, 0]
                    })
                }).addTo(map);
                cityLabels.push(cityNameMarker);
            });

            // 根據縮放級別顯示/隱藏城市名
            const updateCityLabels = () => {
                const zoomLevel = map.getZoom();
                cityLabels.forEach(label => {
                    if (zoomLevel >= 7) {
                        label.setOpacity(1);
                    } else {
                        label.setOpacity(0);
                    }
                });
            };

            map.on('zoomend', updateCityLabels);
            updateCityLabels();

            // 如果有標記，自動調整地圖範圍
            if (visitedCities.length > 0) {
                const bounds = L.latLngBounds(visitedCities.map(c => c.coords));
                map.fitBounds(bounds, {
                    padding: [120, 120],
                    maxZoom: 5
                });
            }
        }

        // 渲染时间表
        function renderSchedule() {

        // 加載景點、博物館卡、飯店、交通、打包清單、推薦資料
        let attractionsData = null;

        // 解析景點名稱並返回完整訊息
        function getAttractionInfo(attractionName) {
            if (!attractionsData) return null;

            // 移除時間前綴 (例如 "13:30 景點名")
            let cleanName = attractionName.replace(/^\d{1,2}:\d{2}\s+/, '').trim();
            // 移除英文括號部分 (例如 "景點 (English Name)")
            cleanName = cleanName.replace(/\s*\([^)]*\)/, '').trim();

            // 精確匹配
            for (const [key, data] of Object.entries(attractionsData.attractions || {})) {
                if (cleanName === key || cleanName.includes(key) || key.includes(cleanName)) {
                    return { key, ...data };
                }
            }
            return null;
        }

        // 獲取博物館卡景點詳細信息
        function getMuseumCardAttractionInfo(attractionName) {
            if (!museumCardData) return null;

            // 清理名稱
            let cleanName = attractionName.trim();
            cleanName = cleanName.replace(/^[🏛️☕🛍️🌲🎓]+\s*/, '').replace(/：.*$/, '').trim();
            // 去掉結尾的括號註記（例如「雕塑公園 (Sculpture Garden)」→「雕塑公園」），方便比對核心名稱
            const coreName = cleanName.replace(/\s*\([^)]*\)\s*$/, '').trim();

            // 搜索匹配
            for (const [key, data] of Object.entries(museumCardData.museumCardRecommendations || {})) {
                if (cleanName === key || cleanName.includes(key) || key.includes(cleanName) ||
                    (data.name && (cleanName.includes(data.name) || data.name.includes(cleanName))) ||
                    (data.englishName && cleanName.includes(data.englishName)) ||
                    (coreName && (key.includes(coreName) || coreName.includes(key)))) {
                    return { key, ...data };
                }
            }
            return null;
        }

        // 從「博物館卡/空檔備案推薦」原始文字中解析出每個景點，並附上詳情資料（若有）
        function getAttractionInfosFromFlexible(flexibleText) {
            const attractionMatches = flexibleText.match(/[🏛️☕🛍️🌲🎓]+\s*[^：\n]+/g) || [];

            // 同一個emoji段落內若用「或」列出多個備案景點，拆開讓每個都能各自查到資訊
            const expandedMatches = [];
            attractionMatches.forEach(match => {
                const emojiPrefix = (match.match(/^[🏛️☕🛍️🌲🎓]+\s*/) || [''])[0];
                const rest = match.slice(emojiPrefix.length);
                rest.split(/\s*或\s*/).forEach(part => {
                    if (part) expandedMatches.push(emojiPrefix + part);
                });
            });

            return expandedMatches.map(match => {
                const cleanName = match.replace(/^[🏛️☕🛍️🌲🎓]+\s*/, '');
                return { match, cleanName, info: getMuseumCardAttractionInfo(match) };
            });
        }

        // 渲染博物館卡景點詳情卡片

        // 渲染新的日視圖（一目了然）
        function renderDayOverview() {
            const tabContent = document.getElementById('overview');

            itinerary.forEach((day, index) => {

                const location = day['地點 / 移動'] || '';
                const highlights = day['精選景點 (含黃金預約時間)'] || '';
                const accommodation = day['每日基地 (住宿地區 / 飯店與訂單資訊)'] || '';
                const schedule = day['行程細項'] || '';
                const tips = day['備註 / 在地指南'] || '';
                const flexible = day['💡 博物館卡 / 空檔備案推薦 (持卡免費或順遊)'] || '';

                if (!date && !location) return;

                // 解析時間表
                const timeSteps = schedule.split('➔').map(s => s.trim()).filter(s => s);

                // 解析景點
                const attractionNames = highlights.split('、').map(s => s.trim()).filter(s => s);

                html += `

                                    <div class="day-info-content">${location}</div>
                                </div>
                            ` : ''}
                        </div>

                        ${(() => {
                            if (!accommodation || accommodation === '-') return '';
                            const hotelMatch = accommodation.match(/【[^】]+】\s*([^（]+)/);
                            const hotelName = hotelMatch ? hotelMatch[1].trim() : null;
                            const hotelInfo = hotelName ? getHotelInfo(hotelName) : null;
                            if (!hotelInfo) {
                                return `<div class="day-info-item" style="margin-top: 12px;">

                                </div>

                        })()}

                        ${highlights ? `
                            <div style="margin-bottom: 15px;">
                                <div style="font-weight: 600; color: #8b5a3c; margin-bottom: 10px;">⭐ 精選景點</div>
                                ${attractionNames.map(name => {
                                    const info = getAttractionInfo(name);
                                    // 清理顯示名稱（移除時間和括號）
                                    const displayName = name.replace(/^\d{1,2}:\d{2}\s+/, '').replace(/\s*\([^)]*\)/, '').trim();
                                    return `
                                        <div class="attraction-card ${info ? '' : 'no-info'}" ${info ? 'onclick="toggleAttraction(event)"' : ''}>
                                            <div class="attraction-header">
                                                <span>${displayName}${info ? ' 📌' : ''}</span>
                                                ${info ? '<span class="attraction-toggle">▼</span>' : ''}

                                            ${info ? `
                                                <div class="attraction-details">
                                                    ${info.city ? `<div class="detail-row"><div class="detail-label">🌍 地點</div><div class="detail-value">${info.city}${navLinkHtml(info.name, info.city)}</div></div>` : ''}
                                                    ${info.description ? `<div class="detail-row"><div class="detail-label">介紹</div><div class="detail-value">${info.description}</div></div>` : ''}
                                                    ${info.openingHours ? `<div class="detail-row"><div class="detail-label">開放時間</div><div class="detail-value">${info.openingHours}</div></div>` : ''}
                                                    ${info.ticket ? `<div class="detail-row"><div class="detail-label">門票</div><div class="detail-value">${info.ticket}</div></div>` : ''}
                                                    ${info.duration ? `<div class="detail-row"><div class="detail-label">預計時間</div><div class="detail-value">${info.duration}</div></div>` : ''}
                                                    ${info.tips ? `<div class="detail-row"><div class="detail-label">💡 提示</div><div class="detail-value">${info.tips}</div></div>` : ''}
                                                    ${info.visitorInsight ? `<div class="detail-row"><div class="detail-label">🗣️ 旅人心得</div><div class="detail-value">${info.visitorInsight}</div></div>` : ''}
                                                    ${info.bookingTime ? `<div class="detail-row"><div class="detail-label">預約時間</div><div class="detail-value">${info.bookingTime}</div></div>` : ''}
                                                </div>
                                            ` : '<div style="padding: 10px; color: #999; font-size: 0.9em;">暫無景點資訊</div>'}
                                        </div>
                                    `;

                            </div>
                        ` : ''}

                        ${timeSteps.length > 0 ? `

                                <div class="day-timeline">
                                    ${timeSteps.map(step => {

                                        return `

                        ${tips ? `

                                <div style="font-weight: 600; color: #8b5a3c; margin-bottom: 4px;">💡 在地指南</div>

                                                ${item.cleanName}
                                                ${hasCard ? '<span style="background: #fff3cd; color: #856404; padding: 2px 6px; border-radius: 3px; font-size: 0.75em; margin-left: 6px; font-weight: 600;">🎫 博物館卡免費</span>' : ''}

                    </div>

            tabContent.innerHTML = html || '<p style="color: white; text-align: center; padding: 40px;">無行程數據</p>';
        }

        // 切換景點卡片展開/折疊
        function toggleAttraction(event) {
            const card = event.currentTarget;
            card.classList.toggle('expanded');
            event.stopPropagation();

        // 返回統一的推薦行程標題
        function getFlexibleTitle(dateStr) {

        }

        // 檢查景點是否有博物館卡支援
        function checkMuseumCardSupport(attractionName) {
            if (!museumCardData) return null;

            // 遍歷所有博物館卡景點
            for (const [key, museum] of Object.entries(museumCardData.museumCardRecommendations || {})) {

                    return museum;

        // 為景點添加博物館卡標注

            }

        // 切換博物館卡容器展開/折疊
        function toggleMuseumCard(event) {

        // 切換飯店卡容器展開/折疊

        // 獲取飯店信息
        function getHotelInfo(hotelName) {
            if (!hotelsData) return null;

            // 清理名稱
            let cleanName = hotelName.trim().replace(/（.*）/, '').trim();

        // 渲染飯店卡片
        function renderHotelCard(info) {
            if (!info) return '';

            // hotels.json 用 type 欄位明確區分「private」（借宿朋友家之類，沒有
            // 可搜尋的正式地點）跟「hotel」（真的飯店）；private 就不加導航連結，
            // 這是比對文字關鍵字更直接的判斷依據（NAV_LINK_STOPLIST 是額外備援）
            const hotelNavLink = info.type === 'private' ? '' : navLinkHtml(info.englishName || info.name, info.city);

                    ${info.email ? `

        // 提取地點（城市名稱）
        // 每日「博物館卡備案」實際對應的城市（移動日備案通常是抵達地或途經地，
        // 不一定是「地點 / 移動」欄位的第一個地名，故用明確對照表取代字串猜測）
        const flexibleCityByDate = {
            '7/31 (五)': '鹿特丹',
            '8/1 (六)': '台夫特',
            '8/2 (日)': '多德雷赫特',
            '8/3 (一)': '阿姆斯特丹',
            '8/4 (二)': '阿姆斯特丹',
            '8/5 (三)': '羊角村',
            '8/6 (四)': '阿姆斯特丹',
            '8/7 (五)': '烏特勒支',
            '8/8 (六)': '梵谷森林',
            '8/9 (日)': '烏特勒支',
            '8/10 (一)': '科隆',
            '8/11 (二)': '法蘭克福',
            '8/12 (三)': '海德堡',
            '8/13 (四)': '法蘭克福',
            '8/14 (五)': '法蘭克福機場'
        };

        // 把推薦項目開頭的「📍順路(...)」標記轉成徽章樣式，其餘文字照常顯示
        function formatRecommendationItem(text) {
            const match = text.match(/^📍順路(\([^)]*\))?\s*/);
            if (!match) return text;
            const badgeText = '📍順路' + (match[1] || '');
            const rest = text.slice(match[0].length);
            return `<span style="display:inline-block; background:#8B6F47; color:#fff; font-size:0.72em; font-weight:700; padding:2px 7px; border-radius:10px; margin-right:6px; vertical-align:middle; white-space:nowrap;">${badgeText}</span>${rest}`;
        }

        // 推薦清單（必吃小吃／推薦餐廳／紀念品）專用：在 formatRecommendationItem
        // 的基礎上，額外從開頭「店名 (地址) - 說明」的固定格式切出店名＋地址，
        // 只有真的有地址（含門牌號碼）才加「導航」連結，連結用「店名＋地址」
        // 組查詢字串（不是城市），單純的產品/品牌名稱（沒有地址）不給連結
        function formatRecommendationItemWithNav(text) {
            const place = extractRecommendationPlace(text);
            const link = place ? navLinkHtml(place.name, place.address) : '';
            return formatRecommendationItem(text) + link;
        }

        // 渲染彈性行程（按城市分類的博物館卡推薦 + 吃喝玩樂推薦）
        function renderFlexible() {
            const container = document.getElementById('flexibleContainer');
            const itinerary = travelData.itinerary || [];

            // 按城市分組（僅限有博物館卡備案的天數）
            const locationGroups = {};

            itinerary.forEach((day, index) => {
                if (!day || typeof day !== 'object') return;

                const date = day['時間'] || '';
                const flexible = day['💡 博物館卡 / 空檔備案推薦 (持卡免費或順遊)'] || '';

                // 只顯示有博物館卡推薦且不是"-"的行程
                if (!flexible || flexible === '-' || !date) return;

                const city = flexibleCityByDate[date] || '其他';

                if (!locationGroups[city]) {
                    locationGroups[city] = [];
                }

                locationGroups[city].push({
                    date,
                    flexible
                });
            });

            let html = '';
            // 按照行程順序排列城市
            const cityOrder = [
                '鹿特丹', '萊頓', '台夫特', '海牙', '多德雷赫特', '阿姆斯特丹', '羊角村',
                '烏特勒支', '梵谷森林', '科隆', '法蘭克福', '海德堡', '法蘭克福機場'
            ];
            // 只要有博物館卡備案「或」吃喝玩樂推薦其中一種內容，該城市就顯示卡片
            const cities = cityOrder.filter(city =>
                locationGroups[city] || recommendationsData?.city_recommendations?.[city]
            );

            if (cities.length === 0) {
                container.innerHTML = `
                    <div class="empty-flexible" style="grid-column: 1 / -1;">
                        <div class="empty-flexible-icon">🏛️</div>
                        <p>暫無博物館卡推薦</p>
                    </div>
                `;
                return;
            }

            cities.forEach(city => {
                const recs = recommendationsData?.city_recommendations?.[city] || {};

                const cityPhotos = {
                    '鹿特丹': 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/A_view_of_Rotterdam%2C_taken_from_the_roof_of_the_Maassilo%2C_Rotterdam%2C_The_Netherlands.jpg/500px-A_view_of_Rotterdam%2C_taken_from_the_roof_of_the_Maassilo%2C_Rotterdam%2C_The_Netherlands.jpg',
                    '萊頓': 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b8/Rapenburg_Leiden_Centrum.jpg/500px-Rapenburg_Leiden_Centrum.jpg',
                    '台夫特': 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/Delft_Blick_von_der_Nieuwe_Kerk_auf_die_Oude_Kerk_1.jpg/500px-Delft_Blick_von_der_Nieuwe_Kerk_auf_die_Oude_Kerk_1.jpg',
                    '海牙': 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/ce/Den_Haag_Skyline_1.jpg/500px-Den_Haag_Skyline_1.jpg',
                    '多德雷赫特': 'https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/Augustijnenkamp%2C_3311_Dordrecht%2C_Netherlands_-_panoramio_%282%29.jpg/500px-Augustijnenkamp%2C_3311_Dordrecht%2C_Netherlands_-_panoramio_%282%29.jpg',
                    '阿姆斯特丹': 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/57/Imagen_de_los_canales_conc%C3%A9ntricos_en_%C3%81msterdam.png/500px-Imagen_de_los_canales_conc%C3%A9ntricos_en_%C3%81msterdam.png',
                    '羊角村': 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/69/Giethoorn_Netherlands_flckr05.jpg/500px-Giethoorn_Netherlands_flckr05.jpg',
                    '烏特勒支': 'https://upload.wikimedia.org/wikipedia/commons/thumb/f/fc/Utrecht_%2816295236803%29.jpg/500px-Utrecht_%2816295236803%29.jpg',
                    '梵谷森林': 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b0/Sand_Area_Hoge_Veluwe.jpg/500px-Sand_Area_Hoge_Veluwe.jpg',
                    '科隆': 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Kranh%C3%A4user_Cologne%2C_April_2018_-01.jpg/500px-Kranh%C3%A4user_Cologne%2C_April_2018_-01.jpg',
                    '法蘭克福': 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/ac/Frankfurt_Main_August_2020_1.jpg/500px-Frankfurt_Main_August_2020_1.jpg',
                    '海德堡': 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/37/K%C3%B6nigstuhl%2C_Heidelberg%2C_U-17.jpg/500px-K%C3%B6nigstuhl%2C_Heidelberg%2C_U-17.jpg',
                    '法蘭克福機場': 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/Frankfurt_Flughafen%2C_Terminal_2.jpg/500px-Frankfurt_Flughafen%2C_Terminal_2.jpg'
                };

                html += `
                    <div class="flexible-location-group">
                        <div class="flexible-location-title" style="background: linear-gradient(rgba(45, 33, 22, 0.35), rgba(45, 33, 22, 0.55)), url('${cityPhotos[city] || ''}') center/cover no-repeat; color: white; padding: 60px 24px; text-align: left; font-size: 2em; font-weight: 800; margin: 0 0 30px 0; border-radius: 4px; text-shadow: 0 2px 6px rgba(0,0,0,0.6); min-height: 160px; display: flex; align-items: flex-end; box-shadow: inset 0 0 0 1px rgba(139, 111, 71, 0.3);">${city}</div>
                `;

                if (locationGroups[city] && locationGroups[city].length > 0) {
                    html += `<div class="flexible-cards-group">`;

                    locationGroups[city].forEach(item => {
                        const attractions = getAttractionInfosFromFlexible(item.flexible);
                        const cardsHtml = attractions.length > 0
                            ? attractions.map(a => {
                                const title = a.info ? `🏛️ ${a.info.name}` : a.cleanName;
                                const body = a.info ? renderMuseumCardAttraction(a.info) : `<div class="flexible-content">${a.cleanName}</div>`;

                        html += `

                }

                html += `
                        <div class="city-recommendations">

                // 推薦小吃
                if (recs.snacks && recs.snacks.length > 0) {
                    html += `
                        <div class="recommendation-section">
                            <div class="recommendation-title">🍽️ 必吃小吃</div>
                            <ul class="recommendation-list">
                    `;
                    recs.snacks.forEach(snack => {
                        html += `<li>${formatRecommendationItemWithNav(snack)}</li>`;
                    });
                    html += `
                            </ul>
                        </div>
                    `;
                }

                // 推薦餐廳
                if (recs.restaurants && recs.restaurants.length > 0) {
                    html += `
                        <div class="recommendation-section">

                    });

                            </ul>
                        </div>
                    `;
                }

                // 推薦紀念品
                if (recs.souvenirs && recs.souvenirs.length > 0) {
                    html += `
                        <div class="recommendation-section">
                            <div class="recommendation-title">🎁 紀念品推薦</div>

                            </ul>

                html += `
                        </div>
                    </div>

            container.innerHTML = html;

        // 渲染大眾交通
        function renderTransport() {
            const container = document.getElementById('transportContainer');

            if (!transportationData || !transportationData.transport_segments) {
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">無交通數據</div>';
                return;
            }

            let html = '';
            transportationData.transport_segments.forEach(day => {
                html += `
                    <div class="transport-card">
                        <div class="transport-day-header">
                            <div class="transport-date">${day.date}</div>
                            <div class="transport-route">${day.segments.map(s => s.route).join(' → ')}</div>
                        </div>
                `;

                day.segments.forEach(segment => {
                    html += `
                        <div class="transport-segment">
                            <div class="transport-method">${segment.method}</div>
                            <div class="transport-info">
                                ${segment.details}
                                ${segment.duration ? `<div class="transport-duration">⏱️ ${segment.duration}</div>` : ''}
                            </div>
                            ${segment.booking ? `<div class="transport-note" style="background: #FBF3E7; border-left-color: #D4A574; color: #6B5335;">🎫 ${segment.booking}</div>` : ''}
                            ${segment.note ? `<div class="transport-note">💡 ${segment.note}</div>` : ''}
                        </div>
                    `;
                });

                if (day.note) {
                    html += `<div class="transport-note">💡 ${day.note}</div>`;
                }

                html += `</div>`;
            });

            container.innerHTML = html;
        }

        // 打包清單相關函數
        function getPackingState() {
            const saved = localStorage.getItem('packingListState');
            return saved ? JSON.parse(saved) : {};
        }

        function savePackingState(state) {
            localStorage.setItem('packingListState', JSON.stringify(state));
        }

        function togglePackingItem(itemId) {
            const state = getPackingState();
            state[itemId] = !state[itemId];
            savePackingState(state);
            updatePackingStats();

            const checkbox = document.querySelector(`input[data-item-id="${itemId}"]`);
            if (checkbox) {
                const itemDiv = checkbox.closest('.packing-item');
                itemDiv.classList.toggle('checked', checkbox.checked);
            }
        }

        function updatePackingStats() {
            const state = getPackingState();
            if (!packingListData) return;

            let totalItems = 0;
            let checkedItems = 0;

            packingListData.packing_categories.forEach(category => {
                category.items.forEach(item => {
                    // 只計算 essential 和 important 的物品
                    if (item.priority === 'essential' || item.priority === 'important') {
                        totalItems++;
                        if (state[item.id]) checkedItems++;
                    }
                });
            });

            const percentage = totalItems > 0 ? Math.round((checkedItems / totalItems) * 100) : 0;
            const statsDiv = document.getElementById('packingStats');
            statsDiv.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <strong>📌 必備物品進度：${checkedItems} / ${totalItems} 項</strong>
                        <div style="margin-top: 8px; height: 6px; background: rgba(255,255,255,0.3); border-radius: 3px; overflow: hidden;">
                            <div style="height: 100%; width: ${percentage}%; background: #4caf50; transition: width 0.3s;"></div>
                        </div>
                    </div>
                    <div style="font-size: 1.5em; font-weight: 800;">${percentage}%</div>
                </div>
            `;
        }

        function renderWeatherOutlook() {
            const container = document.getElementById('weatherOutlookContainer');
            if (!container) return;

            const outlook = packingListData && packingListData.weather_outlook;
            if (!outlook) {
                container.innerHTML = '';
                return;
            }

            const confidenceColor = { high: '#8B6F47', medium: '#D4A574', low: '#C9BBA8' };
            const confidenceLabel = { high: '', medium: '中信心', low: '⚠️低信心' };

            const dailyHtml = (outlook.dailyForecast || []).map(day => `
                <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; background: #fff; border-radius: 6px; padding: 10px 12px; margin-bottom: 6px; border-left: 3px solid ${confidenceColor[day.confidence] || '#D4A574'};">
                    <div style="min-width: 0;">
                        <div style="font-weight: 700; color: #8B6F47; font-size: 0.92em;">${day.date} ${day.location}</div>
                        ${day.flag ? `<div style="font-size: 0.8em; color: #B0522D; margin-top: 2px;">${day.flag}</div>` : ''}
                    </div>
                    <div style="text-align: right; max-width: 45%;">
                        <div style="font-weight: 700; color: #5C4A36; white-space: nowrap;">${day.high}° / ${day.low}°C</div>
                        <div style="font-size: 0.78em; color: #999;">${day.condition} · 🌧️${day.rainChance}%${confidenceLabel[day.confidence] ? ' · ' + confidenceLabel[day.confidence] : ''}</div>
                    </div>
                </div>
            `).join('');

            const warningsHtml = (outlook.warnings || []).map(w => `
                <div style="font-size: 0.85em; color: #6B5335; margin-bottom: 4px;">${w}</div>
            `).join('');

            const sourcesHtml = (outlook.sources || []).map(s => s.label).join('、');

            container.innerHTML = `
                <div style="background: #FBF3E7; border-radius: 10px; padding: 18px 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(139, 111, 71, 0.12);">
                    <div style="font-weight: 800; color: #8B6F47; font-size: 1.1em; margin-bottom: 6px;">☀️ 逐日天氣預報（查詢於 ${outlook.checkedDate}）</div>
                    <div style="font-size: 0.85em; color: #999; margin-bottom: 14px;">⚠️ ${outlook.disclaimer}</div>
                    ${dailyHtml}
                    ${warningsHtml ? `<div style="margin-top: 12px; padding-top: 10px; border-top: 1px dashed #E0CBA8;">${warningsHtml}</div>` : ''}
                    ${outlook.verdict ? `<div style="font-size: 0.9em; color: #6B5335; margin-top: 8px; padding-top: 10px; border-top: 1px dashed #E0CBA8;"><strong>💡 建議：</strong>${outlook.verdict}</div>` : ''}
                    ${sourcesHtml ? `<div style="font-size: 0.75em; color: #B0A08C; margin-top: 10px;">資料來源：${sourcesHtml}</div>` : ''}
                </div>
            `;
        }

            if (!notesData || !notesData.sections) {

                                <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap;">

        function renderPackingList() {
            const container = document.getElementById('packingContainer');

            if (!packingListData || !packingListData.packing_categories) {
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">無打包清單數據</div>';
                return;
            }

            const state = getPackingState();
            let html = '';

            packingListData.packing_categories.forEach(category => {
                html += `
                    <div class="packing-category">
                        <div class="packing-category-title">${category.icon} ${category.category}</div>
                        <div class="packing-items">
                `;

                category.items.forEach(item => {
                    const isChecked = state[item.id] || false;
                    const priorityClass = `priority-${item.priority}`;
                    const itemCheckedClass = isChecked ? 'checked' : '';

                    html += `
                        <label class="packing-item ${itemCheckedClass}">
                            <input
                                type="checkbox"
                                data-item-id="${item.id}"
                                ${isChecked ? 'checked' : ''}
                                onchange="togglePackingItem('${item.id}')"
                            >
                            <span class="packing-item-name">${item.name}</span>
                            <span class="packing-priority ${priorityClass}">${item.priority}</span>
                        </label>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            updatePackingStats();
        }

        function exportPackingList() {
            if (!packingListData) return;

            const state = getPackingState();
            let csvContent = '分類,物品,優先度,已勾選\\n';

            packingListData.packing_categories.forEach(category => {
                category.items.forEach(item => {
                    const isChecked = state[item.id] ? '✓' : '';
                    csvContent += `"${category.category}","${item.name}","${item.priority}","${isChecked}"\\n`;
                });
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);

            link.setAttribute('href', url);
            link.setAttribute('download', `荷蘭德國打包清單_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            alert('✅ 清單已匯出！');
        }

        function clearPackingChecks() {
            if (confirm('確定要重置所有勾選嗎？') === true) {
                localStorage.removeItem('packingListState');
                renderPackingList();
                alert('✅ 已重置清單');
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
